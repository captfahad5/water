<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Water Bottle Logger</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background:#0f172a;
        color:#e2e8f0;
        padding:20px;
    }

    h1 { text-align:center; }

    .topbar {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:10px;
        gap:10px;
    }

    .container { max-width:900px; margin:auto; }

    input, select {
        padding:10px;
        border-radius:8px;
        border:none;
        flex:1;
        min-width:120px;
    }

    button {
        padding:10px 15px;
        border:none;
        border-radius:8px;
        background:#38bdf8;
        cursor:pointer;
        font-weight:bold;
    }

    .card {
        background:#1e293b;
        padding:15px;
        border-radius:12px;
        margin-bottom:15px;
    }

    .row {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-top:10px;
        gap:10px;
        flex-wrap:wrap;
    }

    .small {
        font-size:12px;
        color:#94a3b8;
    }

    .btn {
        padding:5px 8px;
        font-size:12px;
    }

    .history-date {
        background:#0ea5e9;
        color:black;
        padding:4px 10px;
        border-radius:6px;
        font-weight:bold;
        display:inline-block;
    }

    .entry-box {
        margin-top:10px;
        padding:10px;
        border-left:3px solid #38bdf8;
        background:#162033;
        border-radius:8px;
    }

    .entry-qty,
    .entry-amount {
        font-weight:bold;
        font-size:16px;
        margin-top:6px;
    }

    .modal {
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.6);
        display:none;
        align-items:center;
        justify-content:center;
    }

    .modal-box {
        background:#1e293b;
        padding:20px;
        border-radius:12px;
        display:flex;
        flex-direction:column;
        gap:10px;
        min-width:250px;
    }

    details {
        margin-top:12px;
        background:#0f172a;
        border-radius:8px;
        padding:10px;
    }

    summary {
        cursor:pointer;
        color:#38bdf8;
        font-weight:bold;
        outline:none;
    }

    .history-log {
        margin-top:8px;
        padding:8px 0;
        border-bottom:1px solid #334155;
    }

    .history-log:last-child {
        border-bottom:none;
    }

    .reset-btn {
        background:#22c55e;
        color:#06220f;
    }
</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <h1>Water Bottle Logger</h1>
        <button onclick="toggleView()">History</button>
    </div>

    <div id="appView">
        <div class="row">
            <input id="itemName" placeholder="Enter company name" />
            <button onclick="addItem()">Initiate</button>
        </div>

        <input id="search" placeholder="Search..." oninput="render()" style="width:100%;margin-top:10px" />

        <div id="list"></div>
    </div>

    <div id="historyView" style="display:none"></div>

</div>

<div class="modal" id="dateModal" onclick="closeModalOutside(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <input type="date" id="dateInput" />
        <button onclick="saveDate()">Save</button>
        <button onclick="closeModal()" style="background:red">Cancel</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    updateDoc,
    deleteDoc,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAA8Z5zVivaW69yAK6bPO6tBpfWtzh1LEg",
    authDomain: "water-bottle-logger.firebaseapp.com",
    projectId: "water-bottle-logger",
    storageBucket: "water-bottle-logger.firebasestorage.app",
    messagingSenderId: "454383387158",
    appId: "1:454383387158:web:e48fb9876f00bef862ab37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let items = [];
let history = {};
let view = "active";
let editIndex = null;
let editLogIndex = null;
let selectedCompany = "all";

onSnapshot(collection(db, "items"), (snap) => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
});

onSnapshot(doc(db, "history", "main"), (snap) => {
    history = snap.exists() ? snap.data() : {};
    if (view === "history") renderHistory();
});

function formatDate(d = new Date()) {
    const m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return `${d.getDate()}-${m[d.getMonth()]}-${d.getFullYear()}`;
}

function parseAppDate(str) {
    if (!str) return new Date(0);

    const monthMap = {
        Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
        Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
    };

    const parts = str.split("-");
    if (parts.length !== 3) return new Date(0);

    const day = Number(parts[0]);
    const month = monthMap[parts[1]];
    const year = Number(parts[2]);

    return new Date(year, month, day);
}

function escapeHtml(str = "") {
    return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

window.addItem = async function () {
    const name = document.getElementById("itemName").value.trim();
    if (!name) return;

    await addDoc(collection(db, "items"), {
        name,
        price: 150,
        logs: []
    });

    document.getElementById("itemName").value = "";
};

window.logEntry = async function (i) {
    const qty = prompt("Enter quantity:");
    if (!qty) return;
    if (isNaN(qty)) return alert("Invalid quantity");

    const item = items[i];
    item.logs.push({
        qty: Number(qty),
        date: formatDate(),
        comment: ""
    });

    await updateDoc(doc(db, "items", item.id), {
        logs: item.logs
    });
};

window.editPrice = async function (i) {
    const item = items[i];
    const newPrice = prompt("Enter price:", item.price);

    if (newPrice === null) return;
    if (isNaN(newPrice)) return alert("Invalid price");

    await updateDoc(doc(db, "items", item.id), {
        price: Number(newPrice)
    });
};

window.editComment = async function (i, j) {
    const item = items[i];
    const currentComment = item.logs[j].comment || "";
    const newComment = prompt("Enter comment:", currentComment);

    if (newComment === null) return;

    item.logs[j].comment = newComment.trim();

    await updateDoc(doc(db, "items", item.id), {
        logs: item.logs
    });
};

window.payCompany = async function (i) {
    const item = items[i];
    const logs = item.logs || [];

    if (!logs.length) {
        alert("No entries to move to history");
        return;
    }

    const totalQty = logs.reduce((a, b) => a + Number(b.qty || 0), 0);
    const totalAmount = totalQty * (item.price || 0);

    const ref = doc(db, "history", "main");
    const snap = await getDoc(ref);
    const data = snap.exists() ? snap.data() : {};

    if (!data[item.name]) data[item.name] = [];

    data[item.name].push({
        totalQty,
        totalAmount,
        paidDate: formatDate(),
        logs: logs.map(log => ({
            qty: Number(log.qty || 0),
            date: log.date || "",
            comment: log.comment || ""
        }))
    });

    await setDoc(ref, data);

    await updateDoc(doc(db, "items", item.id), {
        logs: []
    });

    alert("Moved to History");
};

window.deleteCompany = async function (i) {
    if (!confirm("Delete Company?")) return;
    await deleteDoc(doc(db, "items", items[i].id));
};

window.editDate = function (i, j) {
    editIndex = i;
    editLogIndex = j;
    document.getElementById("dateModal").style.display = "flex";
};

window.saveDate = async function () {
    const val = document.getElementById("dateInput").value;
    if (!val) return;

    closeModal();

    try {
        const item = items[editIndex];
        item.logs[editLogIndex].date = formatDate(new Date(val));

        await updateDoc(doc(db, "items", item.id), {
            logs: item.logs
        });
    } catch (err) {
        console.error(err);
    }
};

window.deleteEntry = async function (i, j) {
    if (!confirm("Delete entry?")) return;

    const item = items[i];
    item.logs.splice(j, 1);

    await updateDoc(doc(db, "items", item.id), {
        logs: item.logs
    });
};

window.closeModal = function () {
    document.getElementById("dateModal").style.display = "none";
};

window.closeModalOutside = function (e) {
    if (e.target.id === "dateModal") closeModal();
};

window.toggleView = function () {
    view = view === "active" ? "history" : "active";

    document.getElementById("appView").style.display =
        view === "active" ? "block" : "none";

    document.getElementById("historyView").style.display =
        view === "history" ? "block" : "none";

    if (view === "history") renderHistory();
};

window.changeFilter = function () {
    const filter = document.getElementById("historyFilter");
    selectedCompany = filter ? filter.value.trim() : "all";
    renderHistory();
};

window.resetHistoryFilter = function () {
    selectedCompany = "all";
    renderHistory();
};

window.updateHistoryFilterOptions = function () {
    const filter = document.getElementById("historyFilter");
    if (!filter) return;

    const companies = Object.keys(history || {});
    filter.innerHTML = `<option value="all">All Companies</option>`;

    companies.forEach((company) => {
        filter.innerHTML += `<option value="${escapeHtml(company)}">${escapeHtml(company)}</option>`;
    });

    if (selectedCompany !== "all" && !companies.includes(selectedCompany)) {
        selectedCompany = "all";
    }

    filter.value = selectedCompany;
};

window.deleteHistoryEntry = async function (company, index) {
    if (!confirm("Delete entry?")) return;

    history[company].splice(index, 1);

    if (history[company].length === 0) {
        delete history[company];
        if (selectedCompany === company) {
            selectedCompany = "all";
        }
    }

    await setDoc(doc(db, "history", "main"), history);
    renderHistory();
};

window.deleteHistoryCompany = async function (company) {
    if (!confirm("Delete full history?")) return;

    delete history[company];

    if (selectedCompany === company) {
        selectedCompany = "all";
    }

    await setDoc(doc(db, "history", "main"), history);
    renderHistory();
};

window.renderHistory = function () {
    const div = document.getElementById("historyView");
    const data = history || {};
    const companies = Object.keys(data);

    div.innerHTML = `
        <div class="row" style="margin-bottom:10px;">
            <h2 style="margin:0;">History</h2>
            <button class="reset-btn" onclick="resetHistoryFilter()">Reset</button>
        </div>

        <div style="margin-bottom:10px;">
            <select id="historyFilter" onchange="changeFilter()" style="width:100%;">
                <option value="all">All Companies</option>
            </select>
        </div>
    `;

    updateHistoryFilterOptions();

    const filterValue = (selectedCompany || "all").trim();
    const visibleCompanies = filterValue === "all"
        ? companies
        : companies.filter(company => company === filterValue);

    if (visibleCompanies.length === 0) {
        div.innerHTML += `
            <div style="text-align:center;color:#94a3b8;margin-top:20px;">
                No history found
            </div>
        `;
        return;
    }

    visibleCompanies.forEach((company) => {
        const safeCompany = JSON.stringify(company);

        div.innerHTML += `
            <div class="card">
                <div class="row">
                    <h3>${escapeHtml(company)}</h3>
                    <button style="background:red" onclick='deleteHistoryCompany(${safeCompany})'>
                        Delete Company
                    </button>
                </div>
        `;

        [...data[company]]
            .sort((a, b) => parseAppDate(b.paidDate) - parseAppDate(a.paidDate))
            .forEach((entry, i) => {
                const safeLogs = Array.isArray(entry.logs) ? entry.logs : [];

                div.innerHTML += `
                    <div class="entry-box">
                        <div class="row">
                            <div class="history-date">${escapeHtml(entry.paidDate || "")}</div>
                            <button style="background:#ef4444" onclick='deleteHistoryEntry(${safeCompany}, ${i})'>
                                Delete
                            </button>
                        </div>

                        <div class="entry-qty">Qty: ${Number(entry.totalQty || 0)}</div>
                        <div class="entry-amount">Amount: ${Number(entry.totalAmount || 0)}</div>

                        <details>
                            <summary>View Dates (${safeLogs.length})</summary>
                            ${
                                safeLogs.length
                                    ? safeLogs.map(log => `
                                        <div class="history-log">
                                            <div>${escapeHtml(String(log.qty))} - ${escapeHtml(log.date || "")}</div>
                                            ${log.comment ? `<div class="small">Comment: ${escapeHtml(log.comment)}</div>` : ""}
                                        </div>
                                    `).join("")
                                    : `<div style="margin-top:8px;color:#94a3b8;">No saved dates</div>`
                            }
                        </details>
                    </div>
                `;
            });

        div.innerHTML += `</div>`;
    });
};

window.render = function () {
    const list = document.getElementById("list");
    const search = document.getElementById("search").value.toLowerCase();

    list.innerHTML = "";

    items
        .filter(item => (item.name || "").toLowerCase().includes(search))
        .forEach((item, i) => {
            const logs = item.logs || [];
            const totalQty = logs.reduce((a, b) => a + Number(b.qty || 0), 0);
            const totalAmount = totalQty * (item.price || 0);

            let html = `
                <div class="card">
                    <h2>${escapeHtml(item.name || "")}</h2>
                    <div class="small">Qty: ${totalQty} | Amount: ${totalAmount}</div>

                    <div class="row">
                        <button onclick="logEntry(${i})">Add</button>
                        <button onclick="editPrice(${i})">Edit Price</button>
                        <button onclick="payCompany(${i})">Paid</button>
                        <button onclick="deleteCompany(${i})">Delete</button>
                    </div>
            `;

            logs.forEach((log, j) => {
                html += `
                    <div class="row">
                        <div>
                            <div>${escapeHtml(String(log.qty))} - ${escapeHtml(log.date || "")}</div>
                            ${log.comment ? `<div class="small">Comment: ${escapeHtml(log.comment)}</div>` : ""}
                        </div>
                        <div>
                            <button class="btn" onclick="editDate(${i},${j})">Edit</button>
                            <button class="btn" onclick="editComment(${i},${j})">Comment</button>
                            <button class="btn" onclick="deleteEntry(${i},${j})">X</button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            list.innerHTML += html;
        });
};
</script>

</body>
</html>
