<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Water Bottle Logger</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background:#0f172a;
        color:#e2e8f0;
        padding:20px;
    }

    h1 { text-align:center; }

    .topbar {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:10px;
    }

    .container { max-width:900px; margin:auto; }

    input {
        padding:10px;
        border-radius:8px;
        border:none;
        flex:1;
        min-width:120px;
    }

    button {
        padding:10px 15px;
        border:none;
        border-radius:8px;
        background:#38bdf8;
        cursor:pointer;
        font-weight:bold;
    }

    .card {
        background:#1e293b;
        padding:15px;
        border-radius:12px;
        margin-bottom:15px;
    }

    .row {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-top:10px;
        gap:10px;
    }

    .small {
        font-size:12px;
        color:#94a3b8;
    }

    .btn {
        padding:5px 8px;
        font-size:12px;
    }

    .history-date {
        background:#0ea5e9;
        color:black;
        padding:4px 10px;
        border-radius:6px;
        font-weight:bold;
        display:inline-block;
    }

    .entry-box {
        margin-top:10px;
        padding:10px;
        border-left:3px solid #38bdf8;
    }

    .entry-qty,
    .entry-amount {
        font-weight:bold;
        font-size:16px;
    }

    .modal {
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.6);
        display:none;
        align-items:center;
        justify-content:center;
    }

    .modal-box {
        background:#1e293b;
        padding:20px;
        border-radius:12px;
        display:flex;
        flex-direction:column;
        gap:10px;
        min-width:250px;
    }

    details {
        margin-top:10px;
    }

    summary {
        cursor:pointer;
        color:#38bdf8;
        font-weight:bold;
    }
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <h1>Water Bottle Logger</h1>
    <button onclick="toggleView()">History</button>
</div>

<div id="appView">
    <div class="row">
        <input id="itemName" placeholder="Enter company name" />
        <button onclick="addItem()">Initiate</button>
    </div>

    <input id="search" placeholder="Search..." oninput="render()" style="width:100%;margin-top:10px"/>

    <div id="list"></div>
</div>

<div id="historyView" style="display:none"></div>

</div>

<div class="modal" id="dateModal" onclick="closeModalOutside(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <input type="date" id="dateInput" />
        <button onclick="saveDate()">Save</button>
        <button onclick="closeModal()" style="background:red">Cancel</button>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    updateDoc,
    deleteDoc,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAA8Z5zVivaW69yAK6bPO6tBpfWtzh1LEg",
  authDomain: "water-bottle-logger.firebaseapp.com",
  projectId: "water-bottle-logger",
  storageBucket: "water-bottle-logger.firebasestorage.app",
  messagingSenderId: "454383387158",
  appId: "1:454383387158:web:e48fb9876f00bef862ab37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let items = [];
let history = {};
let view = "active";
let editIndex = null;
let editLogIndex = null;
let selectedCompany = "all";

onSnapshot(collection(db,"items"), snap=>{
    items = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
});

onSnapshot(doc(db,"history","main"), snap=>{
    history = snap.exists() ? snap.data() : {};
    if(view==="history") renderHistory();
});

function formatDate(d=new Date()){
    const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d.getDate()}-${m[d.getMonth()]}-${d.getFullYear()}`;
}

window.addItem = async function(){
    const name = document.getElementById("itemName").value.trim();
    if(!name) return;

    await addDoc(collection(db,"items"),{
        name,
        price:150,
        logs:[]
    });

    document.getElementById("itemName").value="";
};

window.logEntry = async function(i){
    const qty = prompt("Enter quantity:");
    if(!qty) return;

    let item = items[i];
    item.logs.push({qty:Number(qty),date:formatDate()});

    await updateDoc(doc(db,"items",item.id),{
        logs:item.logs
    });
};

window.editPrice = async function(i){
    let item = items[i];

    const newPrice = prompt("Enter price:", item.price);
    if(newPrice === null) return;

    if(isNaN(newPrice)) return alert("Invalid price");

    await updateDoc(doc(db,"items",item.id),{
        price:Number(newPrice)
    });
};

window.payCompany = async function(i){
    let item = items[i];

    let totalQty = item.logs.reduce((a,b)=>a+b.qty,0);
    let totalAmount = totalQty*(item.price||0);

    const ref = doc(db,"history","main");
    let snap = await getDoc(ref);

    let data = snap.exists() ? snap.data() : {};

    if(!data[item.name]) data[item.name] = [];

    data[item.name].push({
        totalQty,
        totalAmount,
        paidDate:formatDate(),
        logs:[...item.logs]
    });

    await setDoc(ref,data);

    await updateDoc(doc(db,"items",item.id),{
        logs:[]
    });

    alert("Moved to History");
};

window.deleteCompany = async function(i){
    if(!confirm("Delete Company?")) return;
    await deleteDoc(doc(db,"items",items[i].id));
};

window.editDate = function(i,j){
    editIndex = i;
    editLogIndex = j;
    document.getElementById("dateModal").style.display="flex";
};

window.saveDate = async function(){
    const val = document.getElementById("dateInput").value;
    if(!val) return;

    closeModal();

    try {
        let item = items[editIndex];
        item.logs[editLogIndex].date = formatDate(new Date(val));

        await updateDoc(doc(db,"items",item.id),{
            logs:item.logs
        });

    } catch(err){
        console.error(err);
    }
};

window.deleteEntry = async function(i,j){
    if(!confirm("Delete entry?")) return;

    let item = items[i];
    item.logs.splice(j,1);

    await updateDoc(doc(db,"items",item.id),{
        logs:item.logs
    });
};

window.closeModal = function(){
    document.getElementById("dateModal").style.display="none";
};

window.closeModalOutside = function(e){
    if(e.target.id==="dateModal") closeModal();
};

window.toggleView = function(){
    view = view==="active"?"history":"active";

    document.getElementById("appView").style.display =
        view==="active"?"block":"none";

    document.getElementById("historyView").style.display =
        view==="history"?"block":"none";

    if(view==="history") renderHistory();
};

window.changeFilter = function(){
    selectedCompany = document.getElementById("historyFilter").value;
    renderHistory();
};

window.updateHistoryFilterOptions = function(){
    const filter = document.getElementById("historyFilter");
    if(!filter) return;

    filter.innerHTML = `<option value="all">All Companies</option>`;

    Object.keys(history || {}).forEach(c=>{
        filter.innerHTML += `<option value="${c}">${c}</option>`;
    });

    filter.value = selectedCompany;
};

window.deleteHistoryEntry = async function(company,index){
    if(!confirm("Delete entry?")) return;

    history[company].splice(index,1);

    if(history[company].length === 0){
        delete history[company];
    }

    await setDoc(doc(db,"history","main"), history);
    renderHistory();
};

window.deleteHistoryCompany = async function(company){
    if(!confirm("Delete full history?")) return;

    delete history[company];

    await setDoc(doc(db,"history","main"), history);
    renderHistory();
};

window.renderHistory = function(){
    const div = document.getElementById("historyView");
    const data = history || {};

    div.innerHTML = `
        <h2>History</h2>

        <div style="margin-bottom:10px;">
            <select id="historyFilter" onchange="changeFilter()"
                style="padding:10px;border-radius:8px;width:100%;">
                <option value="all">All Companies</option>
            </select>
        </div>
    `;

    updateHistoryFilterOptions();

    let hasData = false;

    Object.keys(data).forEach(company=>{

        if(selectedCompany !== "all" && selectedCompany !== company) return;

        hasData = true;

        div.innerHTML += `
        <div class="card">
            <div class="row">
                <h3>${company}</h3>
                <button style="background:red"
                    onclick="deleteHistoryCompany('${company}')">
                    Delete Company
                </button>
            </div>
        `;

        data[company].forEach((entry,i)=>{
            div.innerHTML += `
            <div class="entry-box">
                <div class="row">
                    <div class="history-date">${entry.paidDate}</div>

                    <button style="background:#ef4444"
                        onclick="deleteHistoryEntry('${company}',${i})">
                        Delete
                    </button>
                </div>

                <div class="entry-qty">Qty: ${entry.totalQty}</div>
                <div class="entry-amount">Amount: ${entry.totalAmount}</div>

                <details>
                    <summary>View Dates</summary>
                    ${
                        entry.logs && entry.logs.length
                        ? entry.logs.map(log => `
                            <div class="row" style="margin-top:8px;padding:8px 0;border-bottom:1px solid #334155;">
                                <div>${log.qty} - ${log.date}</div>
                            </div>
                        `).join("")
                        : `<div style="margin-top:8px;color:#94a3b8;">No saved dates</div>`
                    }
                </details>
            </div>`;
        });

        div.innerHTML += `</div>`;
    });

    if(!hasData){
        div.innerHTML += `
            <div style="text-align:center;color:#94a3b8;margin-top:20px;">
                No history found
            </div>
        `;
    }
};

window.render = function(){
    const list = document.getElementById("list");
    const search = document.getElementById("search").value.toLowerCase();

    list.innerHTML="";

    items
    .filter(i=>i.name.toLowerCase().includes(search))
    .forEach((item,i)=>{

        let logs = item.logs||[];
        let totalQty = logs.reduce((a,b)=>a+b.qty,0);
        let totalAmount = totalQty*(item.price||0);

        let html=`
        <div class="card">
            <h2>${item.name}</h2>

            <div class="small">Qty: ${totalQty} | Amount: ${totalAmount}</div>

            <div class="row">
                <button onclick="logEntry(${i})">Add</button>
                <button onclick="editPrice(${i})">Edit Price</button>
                <button onclick="payCompany(${i})">Paid</button>
                <button onclick="deleteCompany(${i})">Delete</button>
            </div>
        `;

        logs.forEach((log,j)=>{
            html+=`
            <div class="row">
                <div>${log.qty} - ${log.date}</div>
                <div>
                    <button class="btn" onclick="editDate(${i},${j})">Edit</button>
                    <button class="btn" onclick="deleteEntry(${i},${j})">X</button>
                </div>
            </div>`;
        });

        html+="</div>";
        list.innerHTML+=html;
    });
};

</script>

</body>
</html>
